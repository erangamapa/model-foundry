[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "model-foundry"
version = "0.1.0"
description = "Training ground for the cheaper rungs of the sportsbook model ladder"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Eranga Mapa" }]
dependencies = [
  "pydantic>=2.7",
  "pyyaml>=6",
  "scikit-learn>=1.4",
  "numpy>=1.26",
  "jinja2>=3.1",
  "sportsbook-contracts",
]

[project.optional-dependencies]
train = [
  "torch>=2.3",
  "transformers>=4.44",
  "peft>=0.12",
  "trl>=0.20",
  "bitsandbytes>=0.43",
  "datasets>=2.20",
  "accelerate>=0.33",
]
label = ["anthropic>=0.40", "openai>=1.50"]
serve = ["vllm>=0.6"]
hub = ["huggingface-hub>=0.24"]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.hatch.build.targets.wheel]
packages = ["foundry"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
