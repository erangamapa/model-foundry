name: tweet-classifier-qwen25-15b-lora
task: tweet_classifier
base_model: Qwen/Qwen2.5-1.5B-Instruct
seed: 13
output_dir: artifacts/tweet-classifier-qwen25-15b-lora
data:
  train_path: data/splits/tweets_train.jsonl
  dev_path: data/splits/tweets_dev.jsonl
lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj]
training:
  epochs: 5
  learning_rate: 0.0002
  lr_scheduler: cosine
  warmup_ratio: 0.03
  per_device_batch_size: 4
  gradient_accumulation_steps: 1
  max_seq_length: 512
  packing: false
  weight_decay: 0.01
